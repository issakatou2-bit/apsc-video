# 投稿の棚（queue/）から、公開の時刻が近い台本を、声 → 動画 → 予約公開まで進める。
# 2026-10-08 エマ。本人「定期自動投稿まで」「Actions で自動にする」。
# 台本づくりと監査（scripts/produce.py、ヒロ）は手元。ここは PC なしで回す部分。
#
# 要る Secrets（本人が設定。値は文書やコミットに書かない）：
#   YOUTUBE_CLIENT_ID / YOUTUBE_CLIENT_SECRET / YOUTUBE_REFRESH_TOKEN
#   （手元の .secrets/ から scripts/set_secrets.py で入れられる。本人が実行する）
name: publish

on:
  schedule:
    # 毎日 02:30（日本時間）。その日〜翌朝までに公開する分を予約する。
    - cron: "30 17 * * *"
    # 10/9 初日の 02:30 が動かなかった（GitHub の予約は遅れたり飛んだりする）。予備に 05:40・11:40 も。
    # 済んだ分は published/ に移っているので、2回目以降は残りだけを処理する。
    - cron: "40 20 * * *"
    - cron: "40 2 * * *"
  workflow_dispatch:
    inputs:
      within_hours:
        description: "今から何時間以内に公開する分を処理するか"
        default: "30"
      test_file:
        description: "（試し）queue/ の台本のファイル名。書くと、YouTube に上げずに動画を作るだけ（成果物で確かめる）"
        default: ""

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        # 10/8 Ubuntu の apt の置き場がとても遅く（100〜200KB/秒）、ブラウザの部品と字体の取得で止まった。
        # apt を使わない：ブラウザは入っている Google Chrome、ffmpeg と日本語の字体は GitHub から取る。
        timeout-minutes: 15
        run: |
          pip install -q requests numpy scipy pillow playwright google-api-python-client google-auth
          google-chrome --version
          if ! command -v ffmpeg > /dev/null; then
            curl -sSL -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            mkdir -p /tmp/ff && tar -xJf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
            echo "/tmp/ff/bin" >> "$GITHUB_PATH"
          fi
          mkdir -p ~/.fonts
          for w in Bold Regular; do
            curl -sSL -o ~/.fonts/NotoSansCJKjp-$w.otf https://github.com/notofonts/noto-cjk/raw/main/Sans/OTF/Japanese/NotoSansCJKjp-$w.otf
          done
          fc-cache -f > /dev/null
          ls -la ~/.fonts

      - name: Start VOICEVOX engine
        run: |
          docker run -d --rm -p 50021:50021 --name voicevox voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 60); do
            if curl -s http://127.0.0.1:50021/version > /dev/null; then echo "VOICEVOX ready"; break; fi
            sleep 2
          done
          curl -s http://127.0.0.1:50021/version

      - name: Test render (no upload)
        if: ${{ github.event.inputs.test_file != '' && github.event.inputs.test_file != null }}
        env:
          APSC_BROWSER: chrome
          PYTHONIOENCODING: utf-8
        run: |
          f="queue/${{ github.event.inputs.test_file }}"
          id=$(python -c "import json,sys;print(json.load(open(sys.argv[1],encoding='utf-8'))['id'])" "$f")
          python scripts/mock_build.py "$f" build/test
          python scripts/render_video.py "$id" build/test

      - uses: actions/upload-artifact@v4
        if: ${{ github.event.inputs.test_file != '' && github.event.inputs.test_file != null }}
        with:
          name: test-render
          path: build/test/*.mp4

      - name: Publish from the queue
        if: ${{ github.event.inputs.test_file == '' || github.event.inputs.test_file == null }}
        env:
          APSC_BROWSER: chrome
          PYTHONIOENCODING: utf-8
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python scripts/publish_queue.py --within-hours "${{ github.event.inputs.within_hours || '30' }}"

      - name: Commit the ledger
        if: ${{ github.event.inputs.test_file == '' || github.event.inputs.test_file == null }}
        run: |
          git config user.name "apsc-video bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A queue published mock/published.md
          git diff --cached --quiet || git commit -m "予約公開：棚から投稿（Actions）"
          git pull --rebase -q origin main  # 作業中に棚へ足された分と重ならないように
          git push
