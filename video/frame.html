<!doctype html>
<meta charset="utf-8">
<title>frame</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Oswald:wght@500;600&display=swap">
<!--
  動画の1枚を描くページ（2026-10-08 エマ）。render_video.py が Playwright で開き、
  setup(回のデータ) → setState(状態) → 撮影 をくり返す。立ち絵は描かない（Python 側でコマごとに重ねる）。
  見た目はモック（mock/page.html）の .frame 部分と同じ。場面は回の json の "scenes" から型ごとに組み立てる。
-->
<style>
body{margin:0;background:#000}
.frame{--paper:#f6f8fa;--grid:#dfe7ef;--ink:#17233a;--sub:#4a5872;--marker:#ffe066;--red:#d9443a;--blue:#2f5d9e;--green:#2e8b57;--metan:#c4528a;--zunda:#4b9a2c;
  --f-body:"Zen Kaku Gothic New","Yu Gothic",sans-serif;--f-num:"Oswald","Zen Kaku Gothic New",sans-serif;
  position:relative;overflow:hidden;font-family:var(--f-body);color:var(--ink);
  background-color:var(--paper);background-image:linear-gradient(var(--grid) 2px,transparent 2px),linear-gradient(90deg,var(--grid) 2px,transparent 2px);background-size:48px 48px}
.frame.long{width:1920px;height:1080px}.frame.short{width:1080px;height:1920px}
.tab{position:absolute;left:400px;top:44px;background:var(--ink);color:#fff;font-weight:900;font-size:34px;padding:8px 26px;border-radius:0 0 14px 14px;letter-spacing:.04em}
.tab:empty{display:none}
.topic{position:absolute;right:64px;top:52px;font-size:28px;font-weight:700;color:var(--sub)}
.credit{position:absolute;right:24px;bottom:12px;font-size:18px;color:var(--sub)}
.board{position:absolute;left:400px;top:140px;width:1120px;height:620px}
.short .board{left:60px;top:250px;width:960px;height:900px}
.sc{position:absolute;inset:0;display:none}.sc.show{display:block}
.hid{visibility:hidden}
.stack{display:grid;gap:26px;align-content:start}
.big{font-size:84px;font-weight:900;line-height:1.25}
.mid{font-size:52px;font-weight:900;line-height:1.35}
.sm{font-size:36px;font-weight:700;line-height:1.5;color:var(--sub)}
.head{font-size:46px;font-weight:900}
.num{font-family:var(--f-num);font-weight:600;font-variant-numeric:tabular-nums}
.mk{background:linear-gradient(transparent 58%,var(--marker) 58%);padding:0 .08em}
.card{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:22px 30px;box-shadow:8px 8px 0 var(--ink)}
.chip{display:inline-flex;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:10px 24px;font-size:40px;font-weight:900}
.row{display:flex;gap:20px;flex-wrap:wrap}
.lst{display:grid;gap:18px}
.lst div{display:flex;gap:20px;align-items:center;font-size:40px;font-weight:900;line-height:1.35}
.lst b{display:inline-grid;place-items:center;flex:none;width:62px;height:62px;border-radius:50%;background:var(--ink);color:#fff;font-family:var(--f-num);font-size:40px}
.lv{display:grid;gap:16px}
.lv .card{display:grid;gap:4px;padding:16px 28px}
.lv .card:nth-child(1){margin-right:0}.lv .card:nth-child(2){margin-left:60px}.lv .card:nth-child(3){margin-left:120px}
.lv h3{margin:0;font-size:44px;font-weight:900}.lv p{margin:0;font-size:34px;font-weight:700;color:var(--sub)}
.grid{display:grid;grid-template-columns:230px 1fr 1fr;grid-auto-rows:auto;gap:12px}
.grid .ax{display:grid;place-items:center;font-size:28px;font-weight:900;color:var(--sub);text-align:center}
.grid .cell{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:16px 20px;min-height:150px;display:grid;align-content:start;gap:8px}
.grid .cell .tg{font-size:40px;font-weight:900;color:var(--blue)}
.grid .cell .tx{font-size:34px;font-weight:700}
.fz{position:relative;height:540px}
.fz .f{position:absolute;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:12px 18px;font-size:34px;font-weight:900;text-align:center;display:grid;place-items:center}
.fz .c{left:330px;top:200px;width:460px;height:140px;background:#fff3c4}
.fz .t{left:360px;top:20px;width:400px;height:100px}.fz .b{left:310px;top:420px;width:500px;height:100px}
.fz .l{left:0;top:210px;width:260px;height:120px}.fz .r{left:860px;top:210px;width:260px;height:120px}
.fz svg{position:absolute;inset:0}
.cards3{display:grid;gap:12px}
.cards3 .card{display:grid;gap:2px;padding:10px 26px}.cards3 h3{margin:0;font-size:40px;font-weight:900}.cards3 p{margin:0;font-size:30px;font-weight:700;color:var(--sub)}
.cards3.many{gap:8px}.cards3.many .card{padding:6px 22px;box-shadow:5px 5px 0 var(--ink)}.cards3.many h3{font-size:34px}.cards3.many p{font-size:26px}
.qz .q{font-size:38px;font-weight:900;line-height:1.5}
.qz .ch{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.qz .ch div{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:10px 22px;font-size:40px;font-weight:900}
.qz .ch.one{grid-template-columns:1fr;gap:10px}.qz .ch.one div{font-size:34px;padding:8px 22px}
.qz .ch div.ok{background:#dff3e4;border-color:var(--green);box-shadow:0 0 0 5px var(--green)}
.qz .cnt{font-family:var(--f-num);font-size:150px;font-weight:600;color:var(--red);line-height:1;text-align:center}
.qa .qq{font-size:38px;font-weight:900;line-height:1.45}.qa .qn{display:inline-block;background:var(--ink);color:#fff;border-radius:10px;padding:0 14px;margin-right:14px;font-size:32px}
.qa .card{display:grid;gap:6px;padding:14px 24px}.qa .lb{font-size:24px;font-weight:900;color:var(--sub)}
.qa .cl{font-size:32px;font-weight:700;line-height:1.5}.qa .an{font-size:38px;font-weight:900;color:var(--red)}
.qa .ansc{border-color:var(--red);box-shadow:8px 8px 0 var(--red)}

/* ===== 10/9 演出（本人 OK：章の札・クイズの出題／見本 OK：正解の発表・一覧が順番に・マーカー）。render_video が fx(状態) → fxSeek(ミリ秒) で1コマずつ撮る ===== */
.mk{background-repeat:no-repeat;background-size:100% 100%}
.fxl{position:absolute;inset:0;z-index:4;pointer-events:none}
.fxcover{position:absolute;inset:0;background-color:var(--paper);background-image:linear-gradient(var(--grid) 2px,transparent 2px),linear-gradient(90deg,var(--grid) 2px,transparent 2px);background-size:48px 48px}
.fxcard{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:28px}
.fxno{font-weight:900;font-size:44px;letter-spacing:.04em;color:var(--sub);opacity:0;transform-origin:0 0;white-space:pre}
.fxln{width:1100px;height:6px;background:var(--ink);border-radius:3px;transform:scaleX(0)}
.short .fxln{width:860px}
.fxchars{display:flex;gap:14px}
.fxc{border:5px solid var(--ink);border-radius:14px;background:#fff;display:grid;place-items:center;font-weight:900;box-shadow:8px 8px 0 var(--ink);transform:scale(0);color:var(--ink)}
.fxtab{position:absolute;background:var(--ink);opacity:0;border-radius:0 0 14px 14px}
.tab span{white-space:pre}
/* クイズはウィンドウの形 */
.qz .win{position:relative;background:#fff;border:4px solid var(--ink);border-radius:14px;box-shadow:10px 10px 0 var(--ink);overflow:hidden}
.qz .tb{height:48px;background:var(--ink);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 20px;font-weight:900;font-size:26px}
.qz .tb span:last-child{letter-spacing:.4em}
.qz .wb{padding:18px 26px 22px;display:grid;gap:16px}
.qz{position:relative}
.qz .cnt{position:absolute;right:-26px;top:-30px;z-index:2;width:104px;height:104px;border-radius:50%;background:var(--marker);border:5px solid var(--ink);display:grid;place-items:center;font-size:64px;color:var(--ink)}
.qz .cnt:empty{display:none}
.qz .ch div{position:relative}
.qz .ch div.dim{opacity:.3}
.qz .ch div.ok{background:#fff4c2;border-color:var(--ink);box-shadow:none;transform:scale(1.03)}
.qz .stp{position:absolute;left:6px;top:50%;width:84px;height:84px;margin-top:-42px;border:9px solid var(--red);border-radius:50%}
.qz .okc{position:absolute;right:-14px;top:-28px;background:var(--red);color:#fff;font-size:30px;font-weight:900;padding:4px 20px;border-radius:999px;transform:rotate(4deg)}
.qz .ch.one .stp{width:64px;height:64px;margin-top:-32px;border-width:7px}
.src{font-size:24px;color:var(--sub)}
.brand{position:absolute;inset:0;display:none;background:var(--ink);color:#fff;z-index:5;text-align:center;align-content:center;justify-items:center;gap:22px;padding:0 120px}
.brand.on{display:grid}
.brand .bn{font-size:96px;font-weight:900;letter-spacing:.04em;line-height:1.2}
.short .brand{padding:0 50px}.short .brand .bn{font-size:66px}
.brand .bs{font-size:40px;font-weight:700;color:#c9d6ea;line-height:1.5}
.brand .bt{font-size:34px;font-weight:700;color:#ffe066;line-height:1.4;max-width:1400px}
.brand .bar{width:180px;height:8px;background:#ffe066;border-radius:4px}
.brand.end{background-color:#fbfaf6;background-image:linear-gradient(#e3e9f1 2px,transparent 2px),linear-gradient(90deg,#e3e9f1 2px,transparent 2px);background-size:48px 48px;color:var(--ink);align-content:start;justify-items:center;padding-top:120px}
.short .brand.end{padding-top:200px}
.brand.end .ecsub{font-size:36px;font-weight:900;color:var(--sub)}
.brand.end .ecname{font-family:"Dela Gothic One","Zen Kaku Gothic New",sans-serif;font-size:104px;line-height:1.15;margin:6px 0 4px}
.short .brand.end .ecname{font-size:84px}
.brand.end .ecname .mk{background:linear-gradient(transparent 60%,var(--marker) 60%)}
.brand.end .ecrow{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:1100px;margin-top:14px}
.brand.end .chip{background:var(--ink);color:#fff;font-size:30px;font-weight:900;padding:8px 22px;border-radius:999px}
.brand.end .chip.y{background:var(--marker);color:var(--ink)}
.brand.end .pl{font-size:28px;font-weight:900;color:var(--sub);margin-top:26px}
.brand.end .cta{margin-top:26px;font-size:40px;font-weight:900;background:#fff;border:4px solid var(--ink);border-radius:18px;padding:12px 30px;box-shadow:8px 8px 0 var(--ink)}
.short .brand.end .cta{font-size:38px;max-width:900px;margin-top:40px}
.short .brand.end .ecname{font-size:92px}
.brand.end .today{margin-top:40px;width:860px;background:#fff;border:4px solid var(--ink);border-radius:22px;padding:26px 30px 30px;box-shadow:10px 10px 0 var(--ink);position:relative}
.brand.end .today .lb{position:absolute;left:28px;top:-26px;background:var(--marker);color:var(--ink);font-size:30px;font-weight:900;padding:4px 18px;border-radius:10px;border:3px solid var(--ink)}
.brand.end .today .term{font-weight:900;font-size:88px;line-height:1.2;margin-top:10px}
.brand.end .today .nx{font-size:34px;font-weight:900;color:var(--sub);margin-top:14px;line-height:1.5}
.brand.end .today .nx b{color:var(--ink);background:linear-gradient(transparent 60%,var(--marker) 60%)}
.subt{position:absolute;left:400px;bottom:40px;width:1120px;min-height:150px;box-sizing:border-box;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:22px 30px;font-size:44px;font-weight:700;line-height:1.45}
.short .subt{left:40px;bottom:520px;width:880px;font-size:44px}
.subt .nm{position:absolute;left:24px;top:-26px;font-size:26px;font-weight:900;color:#fff;padding:2px 18px;border-radius:999px}
.subt .nm.metan{background:var(--metan)}.subt .nm.zundamon{background:var(--zunda)}
.subt.off{display:none}
</style>
<body>
<div id="host"></div>
<script>
const NAME={metan:"めたん",zundamon:"ずんだもん"};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const at=(n,html,cls="")=>`<div class="${cls}" data-at="${n}">${html}</div>`;
const B={
  title:s=>`<div class="stack">${at(0,s.lines.map((l,i)=>i===s.mark?`<span class="mk">${esc(l)}</span>`:esc(l)).join("<br>"),"big")}${s.reveal?at(1,`<div class="row">${s.reveal.map(r=>`<span class="chip">${esc(r)}</span>`).join("")}</div>`):""}</div>`,
  list:s=>`<div class="stack">${at(0,esc(s.head),"head")}<div class="lst">${s.items.map((it,i)=>at(s.stepwise?i:0,`<b>${i+1}</b><span>${esc(it)}</span>`)).join("")}</div></div>`,
  levels:s=>`<div class="stack">${at(0,esc(s.head),"head")}<div class="lv">${s.items.map((it,i)=>at(i+1,`<h3>${esc(it.name)}</h3><p>${esc(it.desc)}</p>`,"card")).join("")}</div></div>`,
  grid:s=>`<div class="stack">${at(0,esc(s.head),"head")}<div class="grid"><div></div>${s.cols.map(c=>`<div class="ax">${esc(c)}</div>`).join("")}${[0,1].map(r=>`<div class="ax">${esc(s.rows[r])}</div>`+[0,1].map(c=>{const k=r*2+c,x=s.cells[k];return at(s.order?s.order[k]:k+1,`<div class="tg">${esc(x.tag)}</div><div class="tx">${esc(x.text)}</div>`,"cell")}).join("")).join("")}</div></div>`,
  forces:s=>`<div class="stack">${at(0,esc(s.head),"head")}<div class="fz"><svg viewBox="0 0 1120 540" width="1120" height="540"><g stroke="#17233a" stroke-width="5" fill="none"><line x1="560" y1="120" x2="560" y2="200"/><line x1="560" y1="340" x2="560" y2="420"/><line x1="260" y1="270" x2="330" y2="270"/><line x1="790" y1="270" x2="860" y2="270"/></g></svg>${at(1,esc(s.center),"f c")}${at(2,esc(s.top),"f t")}${at(3,esc(s.bottom),"f b")}${at(4,esc(s.left),"f l")}${at(5,esc(s.right),"f r")}</div></div>`,
  cards:s=>`<div class="stack">${at(0,esc(s.head),"head")}<div class="cards3${s.items.length>=4?" many":""}">${s.items.map((it,i)=>at(i+1,`<h3>${esc(it.name)}</h3><p>${esc(it.desc)}</p>`,"card")).join("")}</div>${s.src?`<div class="src">${esc(s.src)}</div>`:""}</div>`,
  qa:s=>`<div class="stack qa">${at(0,`<span class="qn">${esc(s.n)}</span>${esc(s.q)}`,"qq")}${at(1,`<div class="lb">本文の手がかり</div><div class="cl">${esc(s.clue).replace(/［(.+?)］/g,'<span class="mk">$1</span>')}</div>`,"card")}${at(2,`<div class="lb">解答例</div><div class="an">${esc(s.ans)}</div>`,"card ansc")}${s.src?`<div class="src">${esc(s.src)}</div>`:""}</div>`,
  quiz:s=>`<div class="stack qz"><div class="win"><div class="tb"><span>問題</span><span>_ □ ×</span></div><div class="wb">${at(0,esc(s.q),"q")}<div class="ch${s.cols===1?" one":""}">${s.choices.map((c,i)=>`<div data-choice="${i}">${esc(c)}</div>`).join("")}</div></div></div><div class="cnt num" data-count></div><div class="src">${esc(s.src)}</div></div>`,
};
let EP=null,F=null;
window.setup=(ep)=>{
  EP=ep;const kind=ep.format||"long";
  const scenes=Object.entries(ep.scenes).map(([id,s])=>`<div class="sc" data-sc="${id}" data-type="${s.type}">${B[s.type](s)}</div>`).join("");
  document.getElementById("host").innerHTML=`<div class="frame ${kind}"><div class="tab"></div><div class="topic">${esc(ep.topic||"")}</div><div class="board">${scenes}</div><div class="subt off"><span class="nm"></span><span class="tx"></span></div><div class="brand"></div><div class="credit">VOICEVOX:ずんだもん／VOICEVOX:四国めたん</div></div>`;
  F=document.querySelector(".frame");
  return document.fonts.ready.then(()=>true);
};
// 10/8 本人「最初はチャンネル名、最後は手短なチャンネル説明」。場面名が _open・_end の台詞は、全面の札にする
const BRAND={name:"めたん先生のIT試験ゼミ",sub:"応用情報・情報処理安全確保支援士",end:"用語と解き方を、毎日 ショート2本・解説1本"};
window.setState=(st)=>{
  const br=F.querySelector(".brand");
  if(st.scene==="_open"||st.scene==="_end"){
    br.classList.add("on");
    const short=EP.format==="short";
    br.classList.toggle("end",st.scene==="_end");
    const fields=["経営戦略","ネットワーク","セキュリティ","サービスマネジメント","システム監査","午後問題の解き方"];
    br.innerHTML=st.scene==="_open"
      ?`<div class="bs">${esc(BRAND.sub)}</div><div class="bn">${esc(BRAND.name)}</div><div class="bar"></div><div class="bt">${esc(EP.title||"")}</div>`
      :short
      ?`<div class="ecsub">${esc(BRAND.sub)}</div><div class="ecname">めたん先生の<br><span class="mk">IT試験ゼミ</span></div>
        <div class="today"><span class="lb">今日の用語</span><div class="term">${esc(EP.title||"")}</div>
          <div class="nx">つづきは 再生リスト<br><b>応用情報｜${esc((EP.topic||"").split("｜")[1]||"そのほか")}</b> で</div></div>
        <div class="ecrow" style="margin-top:44px"><span class="chip y">毎日 ショートと解説</span><span class="chip">字幕は台本そのもの</span></div>
        <div class="cta">くわしくは チャンネルの解説動画で ▶</div>`
      :`<div class="ecsub">${esc(BRAND.sub)}</div><div class="ecname">めたん先生の<span class="mk">IT試験ゼミ</span></div>
        <div class="ecrow"><span class="chip y">毎日 ショートと解説を公開</span><span class="chip">IPAの資料をもとに確かめた台本</span><span class="chip">字幕は台本そのもの</span></div>
        <div class="pl">分野ごとの再生リスト</div>
        <div class="ecrow">${fields.map(f=>`<span class="chip">${esc(f)}</span>`).join("")}</div>
        <div class="cta">▶ チャンネル登録で、毎日の続きが届きます</div>`;
    F.querySelector(".subt").classList.add("off");F.querySelector(".tab").textContent="";
    return true;
  }
  br.classList.remove("on");
  F.querySelectorAll(".sc").forEach(sc=>{
    const on=sc.dataset.sc===st.scene;sc.classList.toggle("show",on);if(!on)return;
    sc.querySelectorAll("[data-at]").forEach(e=>e.classList.toggle("hid",+e.dataset.at>st.step));
    if(sc.dataset.type==="quiz"){
      const s=EP.scenes[st.scene];
      sc.querySelectorAll("[data-choice]").forEach(c=>{
        const ok=st.step>=2&&+c.dataset.choice===s.answer;
        c.classList.toggle("ok",ok);c.classList.toggle("dim",st.step>=2&&!ok);
        c.querySelectorAll(".stp,.okc").forEach(e=>e.remove());
        if(ok)c.insertAdjacentHTML("beforeend",'<span class="stp"></span><span class="okc">正解！</span>');
      });
      const cnt=sc.querySelector("[data-count]");cnt.textContent=st.count?st.count:"";
    }
  });
  F.querySelector(".tab").innerHTML=[...(st.chapter||"")].map(c=>`<span>${esc(c)}</span>`).join("");
  F.querySelector(".tab").style.visibility="";
  const sub=F.querySelector(".subt");
  if(st.who){sub.classList.remove("off");const nm=sub.querySelector(".nm");nm.textContent=NAME[st.who];nm.className="nm "+st.who;sub.querySelector(".tx").textContent=st.text}
  else sub.classList.add("off");
  return true;
};

// ---------- 演出（10/9）：fx(状態) で動きを組み、fxSeek(ミリ秒) でその時点の見た目にする ----------
let FX=[],FXEND=null,FXDUR=0;
const BACK="cubic-bezier(.34,1.56,.64,1)",IO="cubic-bezier(.65,0,.35,1)",OUT="cubic-bezier(.2,.8,.2,1)";
const R=el=>{const r=el.getBoundingClientRect(),f=F.getBoundingClientRect();return{x:r.left-f.left,y:r.top-f.top,w:r.width,h:r.height}};
function A(el,kf,o){const a=el.animate(kf,{fill:"both",...o});a.pause();FX.push(a);return a}
window.fxClear=()=>{FX.forEach(a=>a.cancel());FX=[];F.querySelectorAll(".fxl").forEach(e=>e.remove());if(FXEND)FXEND(true);FXEND=null;FXDUR=0};
window.fxSeek=(ms)=>{FX.forEach(a=>{a.currentTime=ms});if(FXEND)FXEND(ms>=FXDUR);return true};
// 章の札：線と文字が出て、文字が縮みながら左上の章の札そのものになる（10/9 本人 OK）
function fxChapter(chapter){
  const tab=F.querySelector(".tab"),W=F.clientWidth;
  const sp=chapter.indexOf(" "),label=sp>0?chapter.slice(0,sp):"",title=sp>0?chapter.slice(sp+1):chapter;
  const n=[...title].length,size=Math.min(150,Math.floor((W*0.82-(n-1)*14)/n)),fs=Math.round(size*0.733);
  const L=document.createElement("div");L.className="fxl";
  L.innerHTML=`<div class="fxcover"></div><div class="fxtab"></div><div class="fxcard">${label?`<div class="fxno">${esc(label)}</div>`:""}<div class="fxln"></div><div class="fxchars">${[...title].map(c=>`<div class="fxc" style="width:${size}px;height:${Math.round(size*1.13)}px;font-size:${fs}px">${esc(c)}</div>`).join("")}</div><div class="fxln"></div></div>`;
  F.appendChild(L);
  const no=L.querySelector(".fxno"),lns=[...L.querySelectorAll(".fxln")],cs=[...L.querySelectorAll(".fxc")],bg=L.querySelector(".fxtab"),cv=L.querySelector(".fxcover");
  const spans=[...tab.children];
  cs.forEach(c=>c.style.transform="none");const card=cs.map(R),noR=no?R(no):null;cs.forEach(c=>c.style.transform="");
  const tb=R(tab);
  lns.forEach((l,i)=>A(l,[{transform:"scaleX(0)"},{transform:"scaleX(1)"}],{duration:250,delay:i*50,easing:OUT}));
  if(no)A(no,[{opacity:0},{opacity:1}],{duration:200,delay:200});
  cs.forEach((c,i)=>A(c,[{transform:"scale(0) rotate(-8deg)"},{transform:"scale(1)"}],{duration:350,delay:250+i*40,easing:BACK}));
  const T0=Math.max(850,250+n*40+300),D=450,k=34/fs;
  const off=label?[...label].length+1:0;
  cs.forEach((c,i)=>{const s=R(spans[off+i]),r=card[i];
    A(c,[{transform:"translate(0px,0px) scale(1)",backgroundColor:"rgb(255,255,255)",borderColor:"rgba(23,35,58,1)",boxShadow:"8px 8px 0 rgba(23,35,58,1)",color:"rgb(23,35,58)"},
         {transform:`translate(${(s.x+s.w/2)-(r.x+r.w/2)}px,${(s.y+s.h/2)-(r.y+r.h/2)}px) scale(${k})`,backgroundColor:"rgba(255,255,255,0)",borderColor:"rgba(23,35,58,0)",boxShadow:"0 0 0 rgba(23,35,58,0)",color:"rgb(255,255,255)"}],
      {duration:D,delay:T0+i*15,easing:IO,fill:"forwards"})});
  if(no){const s0=R(spans[0]);A(no,[{transform:"translate(0px,0px) scale(1)",color:"rgb(74,88,114)"},{transform:`translate(${s0.x-noR.x}px,${s0.y-noR.y}px) scale(${34/44})`,color:"rgb(255,255,255)"}],{duration:D,delay:T0,easing:IO,fill:"forwards"})}
  lns.forEach(l=>A(l,[{opacity:1},{opacity:0}],{duration:150,delay:T0,fill:"forwards"}));
  const x0=Math.min(noR?noR.x:1e9,card[0].x)-30,y0=(noR?noR.y:card[0].y)-20,x1=card[n-1].x+card[n-1].w+30,y1=card[0].y+card[0].h+20;
  Object.assign(bg.style,{left:tb.x+"px",top:tb.y+"px",width:tb.w+"px",height:tb.h+"px",transformOrigin:"0 0"});
  A(bg,[{opacity:0,transform:`translate(${x0-tb.x}px,${y0-tb.y}px) scale(${(x1-x0)/tb.w},${(y1-y0)/tb.h})`},{opacity:.25,offset:.35},{opacity:1,transform:"translate(0px,0px) scale(1,1)"}],{duration:D,delay:T0,easing:IO});
  A(cv,[{opacity:1},{opacity:0}],{duration:300,delay:T0+150});
  tab.style.visibility="hidden";
  FXEND=(done)=>{tab.style.visibility=done?"":"hidden";L.style.display=done?"none":""};
  return T0+D+n*15+30;
}
// クイズの出題：細い帯が横に伸び、縦に開いてウィンドウになる（10/9 本人 OK）
function fxQuiz(sc){
  const win=sc.querySelector(".win"),wb=sc.querySelector(".wb"),chs=[...sc.querySelectorAll("[data-choice]")];
  const H=win.offsetHeight;
  A(win,[{transform:"scaleX(0)"},{transform:"scaleX(1)"}],{duration:140,easing:OUT});
  A(win,[{height:"56px"},{height:"56px",offset:.32},{height:H+"px"}],{duration:440,easing:BACK});
  A(wb,[{opacity:0},{opacity:1}],{duration:180,delay:380});
  chs.forEach((c,i)=>A(c,[{opacity:0,transform:"translateY(24px)"},{opacity:1,transform:"none"}],{duration:350,delay:500+i*60,easing:BACK}));
  return 500+chs.length*60+350;
}
// 正解の発表：ほかが暗く → 正解がぐっと寄る → ○ → 「正解！」（10/9 見本 OK）
function fxAnswer(sc){
  const chs=[...sc.querySelectorAll("[data-choice]")],ok=sc.querySelector("[data-choice].ok");if(!ok)return 0;
  chs.filter(c=>c!==ok).forEach(c=>A(c,[{opacity:1},{opacity:.3}],{duration:250}));
  A(ok,[{transform:"scale(1)",backgroundColor:"#ffffff"},{transform:"scale(1.08)",backgroundColor:"#fff4c2",offset:.4},{transform:"scale(1.03)",backgroundColor:"#fff4c2"}],{duration:320,delay:150,easing:BACK});
  A(ok.querySelector(".stp"),[{opacity:0,transform:"scale(1.8) rotate(-20deg)"},{opacity:1,transform:"scale(1) rotate(0deg)"}],{duration:260,delay:330,easing:BACK});
  A(ok.querySelector(".okc"),[{transform:"scale(0) rotate(-8deg)"},{transform:"scale(1) rotate(4deg)"}],{duration:280,delay:450,easing:BACK});
  return 760;
}
// 一覧・札が順番に出る＋マーカーが引かれる（10/9 見本 OK）
function fxReveal(sc,from){
  const els=[...sc.querySelectorAll("[data-at]")].filter(e=>!e.classList.contains("hid")&&+e.dataset.at>from);
  let end=0;
  els.forEach((e,i)=>{const d=i*90;A(e,[{opacity:0,transform:"translateY(36px)"},{opacity:1,transform:"none"}],{duration:420,delay:d,easing:BACK});end=Math.max(end,d+420);
    e.querySelectorAll(".mk").forEach(m=>{A(m,[{backgroundSize:"0% 100%"},{backgroundSize:"100% 100%"}],{duration:350,delay:d+220,easing:IO});end=Math.max(end,d+570)})});
  return end;
}
window.fx=(st)=>{
  fxClear();const f=st.fx;if(!f)return 0;
  const sc=F.querySelector(`.sc[data-sc="${st.scene}"]`);
  let d=0;
  if(f.chapter&&st.chapter)d=Math.max(d,fxChapter(st.chapter));
  if(sc){
    if(f.kind==="quiz")d=Math.max(d,fxQuiz(sc));
    else if(f.kind==="answer")d=Math.max(d,fxAnswer(sc));
    else if(f.kind==="reveal")d=Math.max(d,fxReveal(sc,f.from));
  }
  FXDUR=d;fxSeek(0);return d;
};
